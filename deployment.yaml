apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigzag-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zigzag
  template:
    metadata:
      labels:
        app: zigzag
    spec:
      containers:
        - name: zigzag
          image: zigzag-marketplace:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
